[project]
name = "control-switch"
version = "0.1.0"
description = "通过 sys-botbase 用电脑控制 Switch"
requires-python = ">=3.11"
dependencies = [
    "crccheck>=1.3.1",
    "jsonpickle>=4.1.4",
    "numpy>=2.4.6",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pyserial>=3.5",
    "python-dotenv>=1.2.4",
    "pyusb>=1.3.1",
    "rapidocr-onnxruntime>=1.4.4",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
